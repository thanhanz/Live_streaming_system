worker_processes auto;
rtmp_auto_push on;
events {}
rtmp {
    server {
        listen 1935;
        listen [::]:1935 ipv6only=on;
        chunk_size 4096;
        allow publish all;

        on_publish http://live-stream-be:8081/livestream/api/stream/on_publish;
        on_publish_done http://live-stream-be:8081/livestream/api/stream/finish;

        #For local (Docker desktop)
        #on_publish http://host.docker.internal:8081/livestream/api/stream/on_publish;
        #on_publish_done http://host.docker.internal:8081/livestream/api/stream/finish;

        application live {
            live on;
            hls off;
        }
    }
}

http {
    server {
        listen 81;
        location / {
            root /www;
        }

        location /control {
            rtmp_control all;
        }

        location /hls {

            add_header Cache-Control no-cache always;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /var/www/html;
        }
    }
}

