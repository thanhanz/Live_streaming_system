spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:livestreaming_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
  web:
    resources:
      static-locations: file:./hls/

#Config thymeleaf
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    enabled: true

server:
  port: 8081
  servlet:
    context-path: /livestream

management:
  endpoints:
    web:
      exposure:
        include=health:
